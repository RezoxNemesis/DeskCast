<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#8cb4ff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- monitor -->
  <rect x="112" y="150" width="300" height="196" rx="22" fill="none" stroke="url(#neon)" stroke-width="16" filter="url(#glow)" opacity="0.9"/>
  <path d="M220 392h86M262 346v46" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  <!-- phone -->
  <rect x="96" y="214" width="108" height="190" rx="20" fill="#07090d" stroke="#38e1ff" stroke-width="15" filter="url(#glow)"/>
  <path d="M136 378h28" stroke="#38e1ff" stroke-width="10" stroke-linecap="round"/>
  <!-- cast waves -->
  <path d="M244 212a44 44 0 0 1 44 44M244 180a76 76 0 0 1 76 76" fill="none" stroke="#9b7bff" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
</svg>
